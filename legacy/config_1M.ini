[Path]
# Target protein-ligand complex for simulation
input_pdb_name = input_PDB/C-lobe_beta.pdb

[System]
# CPU cores (match PBS ppn allocation)
n_cpus = 32
# Random seed for reproducibility (auto = time-based, empty = PID-only)
random_seed = auto

[Docking]
# Total sampling size for initial blind docking
# Estimated runtime: ~14 hours on 32 cores (C-lobe_beta)
total_global_models = 1000000

[Filter]
# Keep structures in the bottom N-th percentile of dG_separated
# 15 = bottom 15% (distribution-independent, robust to skewed dG)
filter_percentile = 15

# Minimum delta-SASA (A^2) to confirm actual interface contact
# Removes non-interacting poses where chains barely touch
min_dSASA = 100.0

# Contact distance cutoff (Angstrom) for binding residue detection
# 4.0 = strict (may miss contacts), 6.0 = standard PPI analysis range
contact_distance = 6.0

# Minimum shape complementarity to confirm geometric fit
min_sc_value = 0.3

# Minimum number of survivors to maintain diversity
min_survivors = 50

[Cluster]
# L_RMSD threshold (Angstrom) for grouping similar binding modes
# auto = ligand 크기에 비례 (4.0 * sqrt(ligand_res / 50), floor=3.0, cap=15.0)
threshold = auto

# Maximum number of cluster leaders
# auto = receptor 크기 기반 (<=200res: 15, 201-400: 25, >400: 35)
cluster_top_n = auto

# Number of diverse structures to select per cluster
members_per_cluster = 5

# Minimum L_RMSD (Angstrom) between members within the same cluster
# auto = threshold의 50%
member_diversity_dist = auto

# Jaccard similarity threshold for site grouping (0 = disabled)
site_group_jaccard = 0.3

[Refinement]
# Iterations of local optimization per representative structure
refine_per_struct = 10

# Fine-tuning parameters for rigid body movement
perturb_trans = 0.1
perturb_rot = 1.0

[Constraints]
# Chain A forbidden residues (membrane face + dimer interface)
# Residues not present in the PDB are silently skipped
excluded_residues_A = 700-807,840-854,863-875,909-914,991-1007

# Chain B key residues (from deletion/mutagenesis studies - SOFT metric only)
key_residues_B = 961-964,968-972,998-1004

# Contact distance (Angstrom) for exclusion zone check
exclusion_contact_dist = 10.0

# Reject poses before DockMCMProtocol if they contact excluded residues
enable_early_rejection = true

# Maximum excluded residue contacts allowed (0 = reject any contact)
max_excluded_contacts = 0

# Scoring bonus weight for key residue contact (0.0 = disabled)
key_residue_bonus_weight = 2.0

# Optional per-residue weights for key_residues_B (default: all 1.0)
# Format: "961:2.0,962-964:1.5,968" (no weight suffix = 1.0)
key_residue_weights =

[MiniRefinement]
# Lightweight refinement of Stage 1 survivors before Stage 2 filtering
enabled = true
mode = pack_only
n_rounds = 3

[FilterStage1]
# Stage 1: Coarse energy filter (remove structurally poor models)
total_score_percentile = 10
max_dG_separated = 0.0
enabled = true

[FilterStage2]
# Stage 2: Interface quality multi-metric filter
# Thresholds relaxed for global blind docking (mini refinement compensates)
min_dSASA = 500.0
max_dG_density = -1.0
min_sc_value = 0.50
min_packstat = 0.55
max_delta_unsatHbonds = 8
min_nres_int = 10
min_hbonds_int = 0
enable_expensive_metrics = true
min_survivors = 50

[Output]
# Maximum number of structures to save from the filtering stage
save_filter_max = 200

# Final selection count for the 'final_result' folder
save_top_n = 20

[ExperimentalData]
# Optional experimental data for validation (leave empty to skip)
critical_residues_B = 961-964,968-972
non_binding_residues_B = 920-930
known_binding_region_A =
confidence = medium
