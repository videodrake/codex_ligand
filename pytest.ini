[pytest]
addopts = --strict-markers
markers =
    smoke: fast pre-qsub regression suite (no docking binaries required)
    full: full integration suite (requires PyRosetta/Vina/LightDock/fpocket)
    reporting: user-facing report, review, or presentation artifact tests that are useful for full regression but non-blocking for pre-qsub validation
    phase1: Workflow B Phase 1 (PPI analysis, TG 1.0~1.6) tests
    phase2: Workflow B Phase 2 (pocket analysis, TG 2.0~2.7) tests
    phase3: Workflow B Phase 3 (focused vina, TG 3.0~3.6) tests
    phase4: Workflow B Phase 4 (perturbation scoring, TG 4.0~4.6) tests
