project_name: smoke_vina
output_root: ./smoke_test/output
max_workers: 16
mode: blind
receptors:
  - id: 3GT8_raw
    source_type: raw_3GT8
    pdb: smoke_test/input/original/3gt8_dimer_anp.pdb
    pdbqt: smoke_test/input/3GT8_raw_receptor.pdbqt
    chain: A
  - id: 3GT8_cl38_48
    source_type: md_cluster_38_48
    pdb: smoke_test/input/original/-10_38-48.pdb
    pdbqt: smoke_test/input/3GT8_cl38_48_receptor.pdbqt
    chain: A
  - id: 3GT8_cl85_100
    source_type: md_cluster_85_100
    pdb: smoke_test/input/original/-10_85-100.pdb
    pdbqt: smoke_test/input/3GT8_cl85_100_receptor.pdbqt
    chain: A
ligands:
  - id: ligand_a
    pdbqt: smoke_test/input/ligand_a_ligand.pdbqt
  - id: ligand_b
    pdbqt: smoke_test/input/ligand_b_ligand.pdbqt
postprocess:
  parse_results: true
  extract_contacts: true
  contact_cutoff: 4.0
  cluster_pockets: true
  pocket_cutoff: 4.0
  summarize_pockets: true
  compare_pockets: true
  comparison_centroid_cutoff: 15.0
  extract_ppi_residues: false
  generate_report: false
