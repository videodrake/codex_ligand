# fresh/configs/pocket.yaml
#
# Pocket discovery (M2.6 fpocket adapter) and pocket gating (M2.7) parameters.
#
# Every value here mirrors the in-code fallback so adopting this file does not
# change pipeline behavior. The file exists because core/manifest.py registers
# it under CONFIG_FILES and load_configs() opens every entry unconditionally
# when initialize_manifests() runs. Without this file, init-run / preflight /
# every CLI that creates a RunContext fails with FileNotFoundError.
#
# Schema reference (read-only sites in code):
#   fresh/src/egfr_myo1d/pocket/fpocket_adapter.py:144-155     (fpocket + merge)
#   fresh/src/egfr_myo1d/pocket/fpocket_adapter.py:641-645     (merge thresholds at apply time)
#   fresh/src/egfr_myo1d/pocket/pocket_gate_apply.py:458-481   (gates thresholds)
#
# Threshold changes here are scientific decisions and require reviewer approval
# per CLAUDE.md absolute rule #8.

schema_version: m2_6_pocket_config_v1
primary_pocket_tool: fpocket
optional_later_tools:
  p2rank:
    enabled: false
    notes: Optional later only; M2.6 does not implement or run P2Rank.

fpocket:
  # External binary name; resolved via shutil.which on the active conda env.
  binary: fpocket
  execution_policy: production mode runs fpocket only on run-local staged receptor PDBs

merge:
  # Centroid distance below which two raw fpocket cavities collapse into one
  # candidate pocket family.
  centroid_merge_threshold_angstrom: 6.0
  # Residue-set Jaccard above which two raw cavities collapse into one family.
  residue_jaccard_merge_threshold: 0.30
  rule: centroid_distance <= threshold OR residue_jaccard >= threshold

gates:
  # ---- ATP-site exclusion (CLAUDE.md absolute rule #2) ----
  # Pockets overlapping the ATP site by more than this fraction are rejected.
  atp_overlap_fraction_reject_threshold: 0.15
  # Pockets whose centroid is closer than this to the ATP centroid are rejected.
  atp_centroid_distance_reject_angstrom: 10.0

  # ---- PPI rim classification ----
  # Distance from any pocket heavy atom to any PPI consensus residue heavy atom
  # below which the pocket is classified as "rim" (touches the interface).
  ppi_rim_heavy_atom_cutoff_angstrom: 6.0
  # Same idea but C-alpha-only.
  ppi_rim_ca_cutoff_angstrom: 10.0

  # ---- Allosteric classification ----
  # Pockets that sit close to (but do not directly overlap) the PPI patch.
  ppi_allosteric_heavy_atom_cutoff_angstrom: 12.0
  ppi_allosteric_ca_cutoff_angstrom: 18.0
  ppi_allosteric_near_centroid_cutoff_angstrom: 18.0

  # ---- Lateral / membrane gating ----
  # Lower bound on the lateral score (membrane-aware projection) to pass.
  lateral_score_pass_threshold: 0.15
  # Lower bound on the membrane-frame z coordinate (upper face is positive z).
  lower_z_minimum: -5.0

  # ---- EGFR-EGFR dimer interface exclusion ----
  # Pockets sitting on the EGFR-EGFR dimer interface (rather than on the
  # MYO1D-facing surface) are rejected.
  interface_heavy_atom_cutoff_angstrom: 5.0
  interface_overlap_fraction_reject_threshold: 0.25
  sasa_ratio_reject_threshold: 0.40

  # ---- State-coverage gating ----
  # Number of primary membrane-validated states a pocket family must appear in
  # to be classified as a primary candidate.
  required_primary_state_count_for_primary: 2
  # If a family appears in only this many primary states, it can still be a
  # secondary candidate (not primary).
  allow_secondary_if_primary_state_count: 1
  hard_gate_rule: hard-gate-failed pockets cannot be rescued by soft score
