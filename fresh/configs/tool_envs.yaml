version: 1
verified_date: "2026-04-30"
verified_hpc_node: node04
source_docs:
  - fresh/docs/hpc_tool_environment_status.md
  - fresh/docs/AGENT_DOC_ROUTING.md

policy:
  default_orchestrator_env: pyrosetta
  run_outputs_root: fresh/runs
  external_tools_root: /work4/eunae/external_tools
  do_not_modify_system_java: true
  no_silent_fallback: true
  adapters_must_log:
    - activated_env
    - executable_or_module
    - command_line
    - stdout_path
    - stderr_path
    - return_code
    - output_manifest_path

envs:
  pyrosetta:
    kind: conda
    role: Core workflow environment.
    python: /home/eunae/.conda/envs/pyrosetta/bin/python
    activate:
      - source /usr/local/anaconda/3/2023.09/etc/profile.d/conda.sh
      - conda activate pyrosetta
    verified_modules:
      pyrosetta: null
      rdkit: "2025.09.2"
      Bio: "1.79"
      numpy: "1.23.5"
      pandas: "2.3.3"
    verified_commands:
      vina:
        path: /usr/local/anaconda/3/2023.09/bin/vina
        version: AutoDock Vina 52ec525-mod
      fpocket:
        path: /home/eunae/.conda/envs/pyrosetta/bin/fpocket
        version: "4.0"
      mdpocket:
        path: /home/eunae/.conda/envs/pyrosetta/bin/mdpocket
        version: "4.0"
      obabel:
        path: /usr/local/anaconda/3/2023.09/bin/obabel
        version: "3.1.0"
      qsub:
        path: /opt/pbs/bin/qsub
        version: "22.05.11"
      qstat:
        path: /opt/pbs/bin/qstat
        version: "22.05.11"
      qdel:
        path: /opt/pbs/bin/qdel
        version: "22.05.11"
      gmx:
        path: /home/eunae/.conda/envs/pyrosetta/bin.AVX2_256/gmx
        version: 2025.4-conda_forge
    use_for:
      - workflow_cli
      - manifest_generation
      - PyRosetta PPI adapters
      - Vina adapters
      - fpocket adapters
      - mdpocket adapters
      - Open Babel conversion
      - PBS submission helpers
      - lightweight GROMACS checks
    do_not_assume:
      - pyKVFinder
      - Java 11
      - InDeep
      - PeSTo
      - MaSIF
      - PocketMiner

  ppi_surface:
    kind: conda
    role: Isolated pyKVFinder environment.
    python: /home/eunae/.conda/envs/ppi_surface/bin/python
    activate:
      - source /usr/local/anaconda/3/2023.09/etc/profile.d/conda.sh
      - conda activate ppi_surface
    verified_modules:
      pyKVFinder: "0.6.16"
      yaml: "6.0.3"
    use_for:
      - pyKVFinder cavity detection
    do_not_assume:
      - pyrosetta
      - rdkit
      - vina
      - fpocket
      - mdpocket

  p2rank_java11:
    kind: conda
    role: Isolated P2Rank Java runtime.
    python: /home/eunae/.conda/envs/p2rank_java11/bin/python
    activate:
      - source /usr/local/anaconda/3/2023.09/etc/profile.d/conda.sh
      - conda activate p2rank_java11
      - export PATH="$HOME/tools/p2rank_2.4.2:$PATH"
    verified_commands:
      java:
        version: OpenJDK 11.0.27
      prank:
        path: $HOME/tools/p2rank_2.4.2/prank
        version: "2.4.2"
    system_java_failure:
      path: /bin/java
      version: "1.8.0_352"
      reason: P2Rank 2.4.2 needs Java 11 class file support.
    use_for:
      - optional P2Rank pocket prediction
    do_not_assume:
      - system Java compatibility

tool_to_env:
  pyrosetta: pyrosetta
  rdkit: pyrosetta
  biopython: pyrosetta
  numpy: pyrosetta
  pandas: pyrosetta
  vina: pyrosetta
  fpocket: pyrosetta
  mdpocket: pyrosetta
  obabel: pyrosetta
  qsub: system
  qstat: system
  qdel: system
  gromacs: pyrosetta
  pyKVFinder: ppi_surface
  p2rank: p2rank_java11

optional_tools:
  indeep:
    status: not_installed
    env: indeep
    required_for_core: false
  pesto:
    status: not_installed
    env: pesto
    required_for_core: false
  masif:
    status: not_installed
    env: masif_or_container
    required_for_core: false
  pocketminer:
    status: not_installed
    env: external
    required_for_core: false
  passer:
    status: external_server_only
    env: external_server
    required_for_core: false

pbs:
  scheduler: PBS
  verified_commands:
    - qsub
    - qstat
    - qdel
  known_nodes:
    - node04
    - node05
    - node06
  gromacs_gmxrc_note: >
    qsub smoke stderr showed a GMXRC set -u interaction. Wrap GMXRC sourcing
    with set +u / set -u or avoid sourcing GMXRC when conda gmx is already on
    PATH.

preflight_interpretation:
  hpc_strict_qsub_smoke: FAIL
  reason: pyKVFinder is intentionally isolated outside pyrosetta.
  core_runtime_status: OK
  adapter_requirement: Run env-specific tool smoke tests from their assigned env.
