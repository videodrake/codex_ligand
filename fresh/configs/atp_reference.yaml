# M2.5 ATP-site reference configuration.
#
# This file backs `cli build-m2-atp-reference` when no override is supplied.
# The residue set preserves the legacy ATP-pocket hard mask from
# egfr_pipeline/verdict.py (ATP_POCKET_RESIDUES). Threshold changes here are
# scientific decisions and should be reviewed together with pocket.yaml gates.

schema_version: atp_reference_v1

allowed_ligand_resnames:
  - ATP
  - ADP
  - AMP
  - ANP
  - ACP
  - AGS

ligand_neighbor_distance_angstrom: 5.0
reference_radius_angstrom: 10.0

configured_residue_set:
  source_id: legacy_egfr_atp_pocket_residue_mask
  evidence_source: egfr_pipeline/verdict.py:ATP_POCKET_RESIDUES
  minimum_residue_count: 3
  notes: legacy_atp_mask_configured_reference_no_ligand_required
  residues:
    - uniprot_residue_number: 718
      residue_name: LEU
      atp_site_region: legacy_atp_pocket_mask
    - uniprot_residue_number: 719
      residue_name: GLY
      atp_site_region: legacy_atp_pocket_mask
    - uniprot_residue_number: 720
      residue_name: SER
      atp_site_region: legacy_atp_pocket_mask
