# Phase 1 PyRosetta PPI Docking Config
# Receptor: EGFR_160-185 (full kinase domain monomer)
# Partner: extended beta-meander (955-1006)
# Construct: full_kinase_domain (NOT legacy dimer)
# Run type: production (seed 2, 20000 models)
# Multi-seed strategy: 5 seeds × 20000 = 100000 total
#
# Key differences from legacy (dimer) configs:
#   - Receptor is monomer (chain A only, ~309 residues)
#   - No +1000 offset dimer residues in excluded_residues_A
#   - Partner is extended beta-meander (955-1006, not 960-1006)
#   - n_cpus = 16 (safe for shared HPC with 32 cores)

[Path]
input_pdb_name = input/PPI/phase1/docking_EGFR_160-185_ext_beta_meander.pdb

[System]
n_cpus = 16
random_seed = 2042

[Docking]
total_global_models = 20000

[Filter]
filter_percentile = 15
min_dsasa = 100.0
contact_distance = 6.0
min_sc_value = 0.3
min_survivors = 50

[Cluster]
threshold = auto
cluster_top_n = auto
members_per_cluster = 5
member_diversity_dist = auto
site_group_jaccard = 0.3

[Refinement]
refine_per_struct = 10
perturb_trans = 0.1
perturb_rot = 1.0

[Constraints]
excluded_residues_a = 709-720,724-731,736-739,747,783-785,799-805,871-873,917-921
key_residues_b = 
exclusion_contact_dist = 10.0
enable_early_rejection = true
max_excluded_contacts = 0
key_residue_bonus_weight = 0.0
key_residue_weights = 

[MiniRefinement]
enabled = true
mode = pack_only
n_rounds = 3

[FilterStage1]
total_score_percentile = 10
max_dg_separated = 0.0
enabled = true

[FilterStage2]
min_dsasa = 500.0
max_dg_density = -1.0
min_sc_value = 0.50
min_packstat = 0.55
max_delta_unsathbonds = 8
min_nres_int = 10
min_hbonds_int = 0
enable_expensive_metrics = true
min_survivors = 50

[Output]
save_filter_max = 200
save_top_n = 20

[ExperimentalData]
critical_residues_b = 
non_binding_residues_b = 
known_binding_region_a = 741-756,831-859
confidence = low

