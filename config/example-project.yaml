bootstrap:
  n_replicates: 200
  sample_fraction: 0.8
  seed: 42
experimental: null
ligands:
- id: '173940'
  pdbqt: input/ligands/173940_ligand.pdbqt
  sdf: input/ligands/173940_ligand.sdf
- id: '97806'
  pdbqt: input/ligands/97806_ligand.pdbqt
  sdf: input/ligands/97806_ligand.sdf
- id: VAX-C12_0
  pdbqt: input/ligands/VAX-C12_0_ligand.pdbqt
  sdf: input/ligands/VAX-C12_0_ligand.sdf
max_workers: 32
mode: blind
output_root: ./output
resources:
  scheduler: pbs
  detect_from_env: true
  vina:
    cpu_per_job: 8
    parallel_receptors: 3
  ppi:
    cpu_per_job: 16
  lightdock:
    cpu_per_job: 16
  phase3:
    cpu_per_job: 4
  gpu:
    enabled: false
    engine: gnina
    cpu_per_job: 4
    devices: auto
postprocess:
  cluster_max_iterations: 15
  cluster_pockets: true
  compare_pockets: true
  comparison_centroid_cutoff: 12.0
  contact_cutoff: 4.0
  extract_contacts: true
  extract_ppi_residues: false
  generate_report: false
  keep_chain: false
  merge_by_residue: true
  merge_centroid_fallback: 8.0
  merge_jaccard: 0.25
  merge_overlap: 0.4
  min_pocket_size: 3
  parse_results: true
  pocket_cutoff: 7.0
  same_patch_centroid_cutoff: 8.0
  same_patch_jaccard: 0.3
  same_patch_overlap: 0.5
  max_poses_per_pocket: 100
  phase3_bridge: true
  phase3_primary_cutoff: -7.0
  phase3_secondary_cutoff: -5.0
  phase3_skip_cutoff: -3.0
  summarize_pockets: true
ppi:
  # AFM fields remain for legacy compatibility only.
  # Current active Phase 1 secondary validation uses LightDock.
  afm_models: null
  afm_settings:
    contact_cutoff: 8.0
    partner_chain: B
    receptor_chain: A
  pyrosetta_result_dirs:
    3GT8_raw:
    - partner: MYO1D_TH1
      path: /work4/hwang/onepack/codex_ligand/EGFR_dimer_TH1_wt/restored
    - partner: MYO1D_beta
      path: /work4/hwang/onepack/codex_ligand/EGFR_dimer_beta_meander_wt/restored
project_name: egfr_myo1d_workflow
# verdict 섹션: 아래 값은 모두 기본값. 필요한 키만 오버라이드하면 됨.
# verdict:
#   # Vina sub-score 최대 점수 배분 (sensitivity analysis 용)
#   vina_affinity_max: 20.0
#   vina_convergence_max: 15.0
#   vina_stability_max: 10.0
#   vina_diversity_max: 15.0
#   # Threshold 예시 (전체 목록은 verdict.py DEFAULT_THRESHOLDS 참조)
#   # affinity_great: -8.0
#   # valid_min: 55
receptors:
- chain: A
  id: 3GT8_raw
  pdb: input/receptors/3GT8_raw.pdb
  pdbqt: input/receptors/3GT8_raw_receptor.pdbqt
  source_type: raw_3GT8
- chain: A
  id: EGFR_160-185
  pdb: input/receptors/EGFR_160-185.pdb
  pdbqt: input/receptors/EGFR_160-185_receptor.pdbqt
  source_type: md_cluster_38_48
- chain: A
  id: EGFR_170-200
  pdb: input/receptors/EGFR_170-200.pdb
  pdbqt: input/receptors/EGFR_170-200_receptor.pdbqt
  source_type: md_cluster_85_100
vina:
  # Legacy aliases retained for compatibility; canonical runtime policy lives in resources.*
  cpu: 8
  energy_range: 10.0
  exhaustiveness: 384
  min_box: 70.0
  mode: blind
  n_poses: 2000
  parallel_receptors: 3
  padding: 5.0
  seed: 20260316
