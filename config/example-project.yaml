project_name: egfr_myo1d_vina
output_root: ./output
max_workers: 16
mode: blind
receptors:
  - id: 3GT8_raw
    source_type: raw_3GT8
    pdb: input/receptors/3GT8_raw.pdb
    pdbqt: input/receptors/3GT8_raw_receptor.pdbqt
    chain: A
  - id: 3GT8_cl38_48
    source_type: md_cluster_38_48
    pdb: input/receptors/3GT8_cl38_48.pdb
    pdbqt: input/receptors/3GT8_cl38_48_receptor.pdbqt
    chain: A
  - id: 3GT8_cl85_100
    source_type: md_cluster_85_100
    pdb: input/receptors/3GT8_cl85_100.pdb
    pdbqt: input/receptors/3GT8_cl85_100_receptor.pdbqt
    chain: A
ligands:
  - id: "173940"
    sdf: input/ligands/173940_ligand.sdf
  - id: "97806"
    sdf: input/ligands/97806_ligand.sdf
  - id: VAX-C12_0
    sdf: input/ligands/VAX-C12_0_ligand.sdf
vina:
  mode: blind
  exhaustiveness: 128
  n_poses: 20
  padding: 5.0
  min_box: 70.0
postprocess:
  parse_results: false
  extract_contacts: false
  contact_cutoff: 4.0
  cluster_pockets: false
  pocket_cutoff: 4.0
  merge_by_residue: false        # post-hoc merge pockets with overlapping residues
  merge_jaccard: 0.3             # Jaccard threshold for merge (OR with overlap)
  merge_overlap: 0.5             # Overlap coefficient threshold for merge
  keep_chain: false              # preserve chain ID in residue comparison
  summarize_pockets: false
  compare_pockets: false
  comparison_centroid_cutoff: 15.0
  extract_ppi_residues: false
  generate_report: false
bootstrap:
  n_replicates: 100
  sample_fraction: 0.8
  seed: 42

experimental:
  # known_binding_residues:     # 실험적으로 확인된 결합 잔기 (mutagenesis, crosslinking)
  #   - 744
  #   - 752
  # known_non_binding_residues: # 확인된 비결합 잔기 (negative control)
  #   - 899
  #   - 950
  # source: "Kim et al. 2023"  # 출처

ppi:
  pyrosetta_result_dirs:
    # 3GT8_raw: /path/to/3GT8_raw/pyrosetta_results
    # 3GT8_cl38_48: /path/to/cl38_48/pyrosetta_results
    # 3GT8_cl85_100: /path/to/cl85_100/pyrosetta_results
  afm_models:
    # 3GT8_raw: /path/to/afm_model_3GT8_raw.pdb
    # 3GT8_cl38_48: /path/to/afm_model_cl38_48.pdb
    # 3GT8_cl85_100: /path/to/afm_model_cl85_100.pdb
  afm_settings:
    receptor_chain: A
    partner_chain: B
    contact_cutoff: 8.0
